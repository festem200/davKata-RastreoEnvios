<app-shell>
    <header>
      <div>
        <p>Panel privado</p>
        <h1>Bienvenido, {{ user?.name ?? 'usuario' }}</h1>
      </div>
      <span>{{ user?.role }}</span>
    </header>

    <section class="summary" aria-label="Resumen">
      <app-metric-card label="Total rutas" [value]="stats()?.totalRoutes ?? 0" />
      <app-metric-card label="Rutas activas" [value]="activeRoutes()" />
      <app-metric-card label="En mantenimiento" [value]="maintenanceRoutes()" />
      <app-metric-card label="Suspendidas" [value]="suspendedRoutes()" tone="warning" />
    </section>

    @if (isLoading()) {
      <section class="dashboard-state" aria-live="polite">
        <strong>Cargando indicadores...</strong>
        <p>Estamos consultando las rutas disponibles.</p>
      </section>
    } @else if (errorMessage()) {
      <section class="dashboard-state dashboard-state--error" role="alert">
        <strong>{{ errorMessage() }}</strong>
        <button type="button" (click)="retry()">Reintentar</button>
      </section>
    } @else {
      <section class="dashboard-grid" aria-label="Indicadores de rutas">
        <app-doughnut-chart title="Total de rutas por estado" [items]="statusTotals()" />
        <app-ranked-routes title="Top 5 rutas con mayor costo" [items]="topCostRoutes()" />
      </section>
    }
</app-shell>
